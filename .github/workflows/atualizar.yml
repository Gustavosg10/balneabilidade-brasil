name: Atualizar Balneabilidade

on:
  schedule:
    - cron: '0 22 * * 4' # Toda quinta-feira às 22:00 UTC (19:00 BRT)
  workflow_dispatch: # Permite rodar manualmente com 1 clique

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar coletor
        run: python coletar.py

      - name: Salvar balneabilidade.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add balneabilidade.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza boletim semanal" && git push)
