name: Atualizar Balneabilidade CETESB

on:
  workflow_dispatch:
  schedule:
    # 18:00 UTC e 22:00 UTC de quinta-feira = 15:00 e 19:00 em Brasília
    - cron: '0 18,22 * * 4'

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar coleta da CETESB
        run: python atualizar_balneabilidade.py

      - name: Commitar balneabilidade.json se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add balneabilidade.json
          git diff --staged --quiet || git commit -m "Atualiza balneabilidade CETESB"
          git push
